name: Native Scene Diagnostics

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Frozen diagnostic dataset
        type: choice
        default: development-v1
        options:
          - development-v1
          - fresh-challenge-v1
  workflow_call:
    inputs:
      dataset:
        type: string
        required: false
        default: development-v1

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 26.5
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer

      - name: Select Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install isolated fixture tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/scene-venv"
          "$RUNNER_TEMP/scene-venv/bin/python" -m pip install --requirement scripts/eval/local-food/requirements-diagnostics.txt

      - name: Verify diagnostic contracts and native core
        run: |
          "$RUNNER_TEMP/scene-venv/bin/python" -B -m unittest discover -s scripts/eval/local-food -p 'test_*.py'
          swift test --package-path ios

      - name: Inspect frozen public fixtures
        env:
          SCENE_DATASET: ${{ inputs.dataset || 'development-v1' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SCENE_ROOT="$RUNNER_TEMP/scene-diagnostics"
          mkdir "$SCENE_ROOT"
          case "$SCENE_DATASET" in
            development-v1)
              SCENE_MANIFEST=scripts/eval/local-food/fixtures.siglip2-development-v1.json
              "$RUNNER_TEMP/scene-venv/bin/python" -B scripts/eval/local-food/make_controls.py "$SCENE_ROOT/images"
              "$RUNNER_TEMP/scene-venv/bin/python" -B scripts/eval/local-food/fetch.py "$SCENE_MANIFEST" "$SCENE_ROOT/images" --spacing-seconds 10
              ;;
            fresh-challenge-v1)
              SCENE_MANIFEST=scripts/eval/local-food/fixtures.fresh-challenge-v1.json
              gh release download photo-screening-fixtures-v1 \
                --repo GFooteGK1/Fitness-Tracker \
                --pattern photo-screening-fixtures-v1.zip --dir "$SCENE_ROOT"
              "$RUNNER_TEMP/scene-venv/bin/python" -B scripts/eval/local-food/fixture_bundle.py unpack \
                "$SCENE_MANIFEST" "$SCENE_ROOT/photo-screening-fixtures-v1.zip" \
                c42772f50d4ef24fc8ea177e772bbe0cee627c7e8c29a52bc722391f69f4825c \
                "$SCENE_ROOT/images"
              ;;
            *) echo "Unsupported frozen dataset" >&2; exit 1 ;;
          esac
          swift run --package-path ios LocalFoodEval "$SCENE_MANIFEST" "$SCENE_ROOT/images" "$SCENE_ROOT/raw.json" scene-diagnostics
          "$RUNNER_TEMP/scene-venv/bin/python" -B scripts/eval/local-food/diagnose_scene.py "$SCENE_MANIFEST" "$SCENE_ROOT/raw.json" "$SCENE_ROOT/summary.json"

      - name: Retain diagnostic observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scene-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/scene-diagnostics/raw.json
            ${{ runner.temp }}/scene-diagnostics/raw.json.partial.json
            ${{ runner.temp }}/scene-diagnostics/summary.json
          if-no-files-found: warn
          retention-days: 30
