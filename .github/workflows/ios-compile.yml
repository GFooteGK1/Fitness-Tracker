name: iOS Native Compile

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-compile.yml"
      - ".github/workflows/ios-testflight.yml"
      - "scripts/ios-signing/**"
      - "scripts/eval/local-food/**"
      - "package.json"
  workflow_dispatch:
    inputs:
      target:
        description: Source to compile (no signing or device installation)
        type: choice
        default: native
        options:
          - native
          - apple-support
          - apple-support-release
          - screening-feasibility
          - scene-diagnostics
      screening_precision:
        description: Precision for screening-feasibility model conversion
        type: choice
        default: FLOAT16
        options:
          - FLOAT16
          - FLOAT32

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target || 'native' }}
  cancel-in-progress: true

jobs:
  compile:
    if: inputs.target != 'apple-support' && inputs.target != 'apple-support-release'
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode 26.5
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl --fail --location --silent --show-error "$XCODEGEN_URL" --output /tmp/xcodegen.zip
          echo "$XCODEGEN_SHA256  /tmp/xcodegen.zip" | shasum --algorithm 256 --check
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          echo "/tmp/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Run deterministic core tests
        run: swift test --package-path ios

      - name: Validate signing workflow contract
        run: npm run test:ios-signing

      - name: Generate Xcode project
        run: /tmp/xcodegen/xcodegen/bin/xcodegen generate --spec ios/project.yml --project ios

      - name: Compile unsigned app and extension
        run: |
          xcodebuild \
            -project ios/SociusFitAutoMeals.xcodeproj \
            -scheme SociusFitAutoMeals \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Evaluate local food classifier on frozen public references
        run: |
          python3 -B -m unittest discover -s scripts/eval/local-food -p 'test_*.py'
          python3 -B scripts/eval/local-food/fetch.py scripts/eval/local-food/fixtures.json "$RUNNER_TEMP/food-reference-images"
          swift run --package-path ios LocalFoodEval scripts/eval/local-food/fixtures.json "$RUNNER_TEMP/food-reference-images" "$RUNNER_TEMP/food-vision-results.json"
          python3 -B scripts/eval/local-food/score.py scripts/eval/local-food/fixtures.json "$RUNNER_TEMP/food-vision-results.json" "$RUNNER_TEMP/food-vision-summary.json"

      - name: Retain classifier observations (no images)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-food-eval-${{ github.sha }}
          path: |
            ${{ runner.temp }}/food-vision-results.json
            ${{ runner.temp }}/food-vision-results.json.partial.json
            ${{ runner.temp }}/food-vision-summary.json
          if-no-files-found: warn
          retention-days: 30

  apple-support:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'apple-support'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out sample source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 26.5
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl --fail --location --silent --show-error "$XCODEGEN_URL" --output "$RUNNER_TEMP/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum --algorithm 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"

      - name: Generate the standalone sample project
        run: |
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate \
            --spec samples/photokit-startup-probe/project.yml \
            --project samples/photokit-startup-probe

      - name: Compile unsigned sample app and extension for simulator and device
        shell: bash
        run: |
          set -euo pipefail
          for platform in 'iOS Simulator' 'iOS'; do
            xcodebuild \
              -project samples/photokit-startup-probe/PhotoUploadProbe.xcodeproj \
              -scheme PhotoUploadProbe \
              -configuration Debug \
              -destination "generic/platform=$platform" \
              -derivedDataPath "$RUNNER_TEMP/photokit-derived" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build
          done

      - name: Package the compiled source and generated project
        run: python3 scripts/ios-support/package-sample.py samples/photokit-startup-probe "$RUNNER_TEMP/apple-support"

      - name: Retain the verified source package
        uses: actions/upload-artifact@v7
        with:
          name: photokit-startup-probe-${{ github.sha }}
          path: |
            ${{ runner.temp }}/apple-support/photokit-startup-probe-source.zip
            ${{ runner.temp }}/apple-support/photokit-startup-probe-source.zip.sha256
          if-no-files-found: error
          retention-days: 30

  screening-feasibility:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'screening-feasibility'
    uses: ./.github/workflows/ios-screening-feasibility.yml
    with:
      precision: ${{ inputs.screening_precision || 'FLOAT16' }}

  scene-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'scene-diagnostics'
    uses: ./.github/workflows/ios-scene-diagnostics.yml

  apple-support-release:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'apple-support-release'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 26.5
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl --fail --location --silent --show-error "$XCODEGEN_URL" --output "$RUNNER_TEMP/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum --algorithm 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"

      - name: Check and prepare the distribution sample
        run: |
          python3 -B -m unittest discover -s scripts/ios-support -p 'test_*.py'
          npm run test:ios-signing
          python3 scripts/ios-support/prepare-testflight-sample.py "$RUNNER_TEMP/photokit-startup-testflight"
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate \
            --spec "$RUNNER_TEMP/photokit-startup-testflight/project.yml" \
            --project "$RUNNER_TEMP/photokit-startup-testflight"

      - name: Compile unsigned distribution sample
        shell: bash
        run: |
          set -euo pipefail
          for platform in 'iOS Simulator' 'iOS'; do
            xcodebuild \
              -project "$RUNNER_TEMP/photokit-startup-testflight/SociusFitAutoMeals.xcodeproj" \
              -scheme SociusFitAutoMeals \
              -configuration Release \
              -destination "generic/platform=$platform" \
              -derivedDataPath "$RUNNER_TEMP/photokit-derived" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              PROBE_SOURCE_SHA="$GITHUB_SHA" \
              build
          done
