name: PhotoUploadProbe
options:
  deploymentTarget:
    iOS: "26.4"
  minimumXcodeGenVersion: "2.46.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    PROBE_UPLOAD_BASE_URL: https://example.invalid
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  PhotoUploadProbe:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Supporting/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Supporting/App-Info.plist
      properties:
        CFBundleDisplayName: Photo Upload Probe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryUsageDescription: This diagnostic tests background extension scheduling after Photos permission.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photouploadprobe
        CODE_SIGN_ENTITLEMENTS: Supporting/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - target: PhotoUploadProbeExtension
        embed: true
  PhotoUploadProbeExtension:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: Extension
      - path: Shared
      - path: Supporting/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Supporting/Extension-Info.plist
      properties:
        BackgroundUploadURLBase: $(PROBE_UPLOAD_BASE_URL)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.photos.background-upload
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photouploadprobe.background-upload
        CODE_SIGN_ENTITLEMENTS: Supporting/Extension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1
schemes:
  PhotoUploadProbe:
    build:
      targets:
        PhotoUploadProbe: all
        PhotoUploadProbeExtension: all
