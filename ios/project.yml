name: SociusFitAutoMeals

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.4"
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.46.0"

settings:
  base:
    APPLE_TEAM_ID: ""
    BACKGROUND_UPLOAD_URL_BASE: https://example.invalid
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
    EXTENSION_PROVISIONING_PROFILE_SPECIFIER: ""
    HOST_PROVISIONING_PROFILE_SPECIFIER: ""
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 6.0

targets:
  SociusFitAutoMeals:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    info:
      path: Supporting/App-Info.plist
      properties:
        CFBundleDisplayName: SociusFit Auto Meals
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryUsageDescription: SociusFit checks new photos on your device so likely meal photos can be prepared for your review.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.sociusfit.automeals
        PROVISIONING_PROFILE_SPECIFIER: $(HOST_PROVISIONING_PROFILE_SPECIFIER)
        TARGETED_DEVICE_FAMILY: 1
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
    dependencies:
      - target: SociusFitAutoMealsBackgroundUpload
        embed: true

  SociusFitAutoMealsBackgroundUpload:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: BackgroundUpload
      - path: Shared
    info:
      path: Supporting/BackgroundUpload-Info.plist
      properties:
        BackgroundUploadURLBase: $(BACKGROUND_UPLOAD_URL_BASE)
        # Fail-closed placeholder. Never point this at /api/meals/upload.
        # A private HTTPS probe endpoint is a separate approval gate.
        CFBundleDisplayName: SociusFit Background Upload
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.photos.background-upload
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.sociusfit.automeals.background-upload
        PROVISIONING_PROFILE_SPECIFIER: $(EXTENSION_PROVISIONING_PROFILE_SPECIFIER)
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution

schemes:
  SociusFitAutoMeals:
    build:
      targets:
        SociusFitAutoMeals: all
        SociusFitAutoMealsBackgroundUpload: all
